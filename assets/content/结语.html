<h2 id="结语">结语</h2>
<p>本知识点体系整合自三份个人笔记、教材 14 章 320 个例题、附录 A–F 及全部实验资料。</p>
<p><strong>三句提纲挈领的话</strong>：</p>
<ol>
<li><strong>类型是 C 的灵魂</strong> —— 90% 的错误都源于"这个表达式到底是什么类型"没想清楚。</li>
<li><strong>格式符是 C 的门面</strong> —— 输入输出对不上，程序照样编译通过，但结果是错的。</li>
<li><strong>括号与边界是 C 的底线</strong> —— 宏加括号、数组留 <code>\0</code>、循环加花括号、下标查边界。</li>
</ol>
