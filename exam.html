<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>备考中心 · C 语言知识库</title>
<meta name="description" content="C 语言期末备考：理论复习要点、理论模拟组卷、编程模拟组卷，支持按章节随机抽题与在线判分。">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/exam.css">
</head>
<body>

<header class="top ex-top">
  <a class="tb ico ex-back" href="index.html" title="返回知识库">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="brand">
    <span class="lg">C</span>
    <div><b>C 语言备考中心</b><span>理论复习 · 模拟组卷</span></div>
  </div>

  <nav class="extabs" id="extabs" role="tablist" aria-label="备考版块">
    <button data-view="review" class="on" role="tab">理论复习</button>
    <button data-view="theory" role="tab">理论模拟</button>
    <button data-view="prog" role="tab">编程模拟</button>
  </nav>

  <div class="tools">
    <div class="seg" role="group" aria-label="外观">
      <button id="m-light" title="浅色外观">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
      </button>
      <button id="m-dark" title="深色外观">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.5 14.2A8.6 8.6 0 0 1 9.8 3.5a8.6 8.6 0 1 0 10.7 10.7z"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="ex-main">

  <!-- ============ 理论复习 ============ -->
  <section class="view on" id="view-review">
    <aside class="ex-side" id="rev-nav" aria-label="章节导航"></aside>
    <div class="ex-body" id="rev-body">
      <div class="ex-hero">
        <span class="kicker">期末 · 理论复习</span>
        <h1>理论知识全掌握</h1>
        <p>按考试方向提炼的 14 章要点，融合老师课堂注意点与往年试卷高频考点。左侧选择章节开始复习。</p>
      </div>
      <div class="ex-empty">正在加载复习资料…</div>
    </div>
  </section>

  <!-- ============ 理论模拟 ============ -->
  <section class="view" id="view-theory">
    <div class="ex-wrap" id="th-wrap">
      <div class="ex-hero">
        <span class="kicker">期末 · 理论模拟</span>
        <h1>随机组卷 · 在线判分</h1>
        <p>选择章节与题型，随机抽取组成模拟卷；交卷后自动判分并逐题讲解。题目源自 2014—2022 历年真题与仿真新题。</p>
      </div>
      <div id="th-stage"></div>
    </div>
  </section>

  <!-- ============ 编程模拟 ============ -->
  <section class="view" id="view-prog">
    <div class="ex-wrap" id="pg-wrap">
      <div class="ex-hero">
        <span class="kicker">期末 · 编程模拟</span>
        <h1>编程题实战演练</h1>
        <p>按章节与难度抽取编程题，先自己写、在线运行验证，再对照参考答案与讲评。答案均经 GCC 实测。</p>
      </div>
      <div id="pg-stage"></div>
    </div>
  </section>

</main>

<button class="top-btn ex-topbtn" id="topbtn" aria-label="回到顶部">↑</button>

<script src="assets/exam_app.js"></script>
</body>
</html>
